name: Windows builds and core checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify committed source inventory and regression-check the verifier
        shell: pwsh
        run: |
          ./tools/source-manifest.ps1 -Mode Verify
          ./tools/test-source-manifest.ps1
      - run: dotnet run --project tests/Vela.Core.Tests -c Release
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
          - architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and publish native WinUI app
        shell: pwsh
        run: ./tools/build.ps1 -Architecture ${{ matrix.architecture }}
      - name: Check Windows media and capability services
        if: matrix.architecture == 'x64'
        shell: cmd
        run: tools\check-windows.cmd x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vela-preview-${{ matrix.architecture }}
          path: artifacts/Vela-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14
